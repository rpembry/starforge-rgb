[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starforge-cues"
version = "0.1.0"
description = "Portable semantic notification cue core"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
starforge-cues = "starforge_cues.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
